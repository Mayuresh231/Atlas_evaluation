[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supportiq"
version = "1.0.0"
description = "Local customer support message classification backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.104,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.5,<3",
  "scikit-learn>=1.5,<2",
  "pandas>=2.2,<3",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.7,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

