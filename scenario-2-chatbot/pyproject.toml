[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scenario-2-chatbot"
version = "0.1.0"
description = "Citation-aware multimodal RAG backend for engineering PDFs and scientific figures"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=2.0,<3",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.3,<6"]
ocr = ["pytesseract>=0.3.13,<1", "pillow>=11,<13"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[project.scripts]
engineering-chatbot = "app.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

